<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Business Card Studio Pro — Fonts & Templates Plus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Great+Vibes&family=Inter:wght@400;500;600;700;800&family=Lato:wght@400;700;900&family=Libre+Baskerville:wght@400;700&family=Montserrat:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&family=Raleway:wght@400;500;600;700;800&family=Roboto+Slab:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#10141c;--panel:#1a202b;--panel2:#242d3b;--line:#374253;--text:#edf2f8;--muted:#aab5c5;--accent:#79e2c4;--blue:#83adff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Arial,sans-serif}
header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;background:#151b25;border-bottom:1px solid var(--line)}.brand{font-size:19px;font-weight:850}.brand b{color:var(--accent)}.actions,.tabs,.buttonrow{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
button,.button{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:8px 10px;border-radius:8px;font-weight:650;cursor:pointer}button:hover{border-color:var(--accent)}button.primary{background:var(--accent);color:#10231d;border-color:var(--accent)}button.active{border-color:var(--accent);background:#254239}button:disabled{opacity:.4;cursor:not-allowed}
.layout{display:grid;grid-template-columns:250px minmax(300px,1fr) 285px;gap:12px;padding:12px;max-width:1700px;margin:auto}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}.panel h2{margin:0;padding:12px;border-bottom:1px solid var(--line);font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}.body{padding:12px;display:grid;gap:12px}.group{display:grid;gap:6px}.group label,.hint{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;min-width:0;padding:8px;border:1px solid var(--line);border-radius:7px;background:#10151d;color:var(--text)}input[type=color]{height:35px;padding:2px}input[type=range]{padding:0}input[type=checkbox]{width:auto;accent-color:var(--accent)}.row{display:grid;grid-template-columns:1fr 1fr;gap:7px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.toolgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.toolgrid button{font-size:12px}.workspace{display:flex;flex-direction:column;gap:10px;min-width:0}.stage{min-height:420px;display:flex;align-items:center;justify-content:center;padding:22px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:radial-gradient(circle,#293343,#151a23 70%)}.cardwrap{flex:none;filter:drop-shadow(0 15px 25px #0007)}.card{position:relative;width:500px;height:300px;overflow:hidden;transform-origin:top left;background:white}.el{position:absolute;white-space:pre-wrap;min-width:8px;min-height:8px;cursor:move;user-select:none;touch-action:none;outline:1px dashed transparent}.el.selected{outline:1px dashed #3b8cff;z-index:999!important}.el img{width:100%;height:100%;object-fit:contain;pointer-events:none}.resize{position:absolute;width:10px;height:10px;right:-5px;bottom:-5px;background:#2682ff;border:1px solid white;display:none}.selected .resize{display:block}.card svg.guides{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.status{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px}.layers{display:grid;gap:5px;max-height:220px;overflow:auto}.layer{display:flex;align-items:center;gap:7px;text-align:left;font-size:12px}.layer span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.layer.active{border-color:var(--accent);background:#253a35}.hidden{display:none!important}.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.swatch{height:24px;padding:0;border-radius:5px}.tiny{font-size:11px;color:var(--muted)}
@media(max-width:1100px){.layout{grid-template-columns:220px minmax(280px,1fr)}.right{grid-column:1/-1}.right .body{grid-template-columns:1fr 1fr}}
@media(max-width:700px){header{align-items:flex-start;flex-direction:column}.layout{display:flex;flex-direction:column;padding:8px}.workspace{order:0}.left{order:1}.right{order:2}.stage{justify-content:flex-start;min-height:320px;padding:12px}.right .body{grid-template-columns:1fr}}
@media print{body{background:white}header,.panel,.tabs,.status{display:none!important}.layout{display:block;padding:0}.stage{display:block;padding:0;min-height:0;background:white;border:0;overflow:visible}.cardwrap{filter:none;margin:0 auto}.card{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style>
</head>
<body>
<header><div class="brand">Business Card <b>Studio Pro</b></div><div class="actions">
<button id="undo">↶ Undo</button><button id="redo">↷ Redo</button><button id="save">Save project</button><button id="load">Load project</button><button id="png">Export PNG</button><button id="pdf" class="primary">Print / PDF</button>
</div></header>
<div class="layout">
<aside class="panel left"><h2>Insert & design</h2><div class="body">
<div class="group"><label>Starter layouts</label><select id="template"><option value="">Choose a starter design…</option><option value="modern">Modern minimal</option><option value="dark">Midnight premium</option><option value="creative">Creative studio</option><option value="elegant">Elegant serif</option><option value="corporate">Corporate blue</option><option value="luxury">Luxury black & gold</option><option value="tech">Technology / startup</option><option value="wellness">Wellness / organic</option><option value="food">Cafe / food brand</option><option value="photography">Photography</option><option value="realestate">Real estate</option><option value="medical">Medical / healthcare</option><option value="fashion">Fashion editorial</option><option value="freelancer">Freelancer / creator</option><option value="bold">Bold color block</option><option value="classic">Classic professional</option><option value="eco">Eco / sustainable</option></select><button id="applyTemplate">Apply template to this side</button></div>
<div class="group"><label>Add element</label><div class="toolgrid"><button id="addText">＋ Text</button><button id="addTitle">＋ Title</button><button id="addRect">▰ Rectangle</button><button id="addCircle">● Circle</button><button id="addLine">／ Line</button><button id="addImage">＋ Logo / photo</button><button id="addQR">▦ QR code</button><button id="addBadge">✦ Badge</button></div><input id="imageFile" class="hidden" type="file" accept="image/*"></div>
<div class="group"><label>Card background</label><input id="bg" type="color" value="#ffffff"><label class="tiny">Or choose a gradient</label><div class="row"><input id="gradA" type="color" value="#ffffff"><input id="gradB" type="color" value="#dce9f5"></div><button id="gradient">Apply gradient</button></div>
<div class="group"><label>Card size</label><select id="preset"><option value="90,54">90 × 54 mm — standard</option><option value="89,51">89 × 51 mm</option><option value="85,55">85 × 55 mm</option><option value="custom">Custom size</option></select><div id="customSize" class="row hidden"><div><label>Width mm</label><input id="mmW" type="number" min="30" max="250" value="90"></div><div><label>Height mm</label><input id="mmH" type="number" min="20" max="150" value="54"></div></div></div>
<div class="group"><label>Canvas helpers</label><div class="toolgrid"><button id="guides">Bleed / safe guides</button><button id="snapToggle" class="active">Snap to grid: ON</button><button id="centerH">Center horizontally</button><button id="centerV">Center vertically</button></div></div>
<div class="group"><label>Palette</label><div class="swatches"><button class="swatch" data-color="#ffffff" style="background:#fff"></button><button class="swatch" data-color="#142238" style="background:#142238"></button><button class="swatch" data-color="#79e2c4" style="background:#79e2c4"></button><button class="swatch" data-color="#f2dfbd" style="background:#f2dfbd"></button><button class="swatch" data-color="#7e5bef" style="background:#7e5bef"></button><button class="swatch" data-color="#e76f51" style="background:#e76f51"></button></div></div>
<p class="hint">Drag items to move. Use the blue corner handle to resize. Use arrow keys for small movements.</p>
</div></aside>
<main class="workspace"><div class="tabs"><button id="front" class="active">Front side</button><button id="back">Back side</button><span class="hint">Front and back are independent.</span></div><div class="stage" id="stage"><div class="cardwrap" id="wrap"><div class="card" id="card"></div></div></div><div class="status"><span id="dimensions">90 × 54 mm</span><span id="selection">Nothing selected</span><span id="zoom">Fit view</span></div></main>
<aside class="panel right"><h2>Properties & layers</h2><div class="body">
<div class="group"><label>Element properties</label><div id="none" class="hint">Select an item on the card or in the layer list.</div><div id="props" class="hidden">
<div class="group" id="contentWrap"><label>Text / QR URL</label><textarea id="content" rows="3"></textarea></div>
<div class="row" id="fontWrap"><div class="group"><label>Font family</label><select id="font"><option>Arial</option><option>Georgia</option><option>Verdana</option><option>Tahoma</option><option>Trebuchet MS</option><option>Times New Roman</option><option>Courier New</option><option>Inter</option><option>Montserrat</option><option>Poppins</option><option>DM Sans</option><option>Lato</option><option>Raleway</option><option>Oswald</option><option>Playfair Display</option><option>Libre Baskerville</option><option>Roboto Slab</option><option>Space Grotesk</option><option>Great Vibes</option></select></div><div class="group"><label>Size px</label><input id="size" type="number" min="5" max="160"></div></div>
<div class="row" id="textStyle"><div class="group"><label>Weight</label><select id="weight"><option value="400">Regular</option><option value="600">Semi-bold</option><option value="700">Bold</option><option value="800">Extra bold</option></select></div><div class="group"><label>Alignment</label><select id="align"><option value="left">Left</option><option value="center">Center</option><option value="right">Right</option></select></div></div>
<div class="row"><div class="group"><label>Text / fill</label><input id="color" type="color"></div><div class="group"><label>Opacity</label><input id="opacity" type="range" min="10" max="100"></div></div>
<div class="row"><div class="group"><label>Width px</label><input id="w" type="number" min="8"></div><div class="group"><label>Height px</label><input id="h" type="number" min="8"></div></div>
<div class="row"><div class="group"><label>X position</label><input id="x" type="number" min="0"></div><div class="group"><label>Y position</label><input id="y" type="number" min="0"></div></div>
<div class="row"><div class="group"><label>Border color</label><input id="border" type="color"></div><div class="group"><label>Border width</label><input id="bw" type="number" min="0" max="25"></div></div>
<div class="row"><button id="forward">Bring forward</button><button id="backward">Send backward</button></div><button id="delete">Delete item</button></div></div>
<div class="group"><label>Layers — top first</label><div id="layers" class="layers"></div><div class="row"><button id="duplicate">Duplicate</button><button id="clear">Clear side</button></div></div>
<div class="group"><label>Quick actions</label><div class="toolgrid"><button id="alignLeft">Align left</button><button id="alignTop">Align top</button><button id="fit">Fit canvas</button><button id="resetZoom">Reset view</button></div></div>
</div></aside>
</div><input id="projectFile" class="hidden" type="file" accept=".json,application/json">
<script>
(()=>{const $=id=>document.getElementById(id),card=$('card'),wrap=$('wrap'),stage=$('stage');let S={width:90,height:54,bg:'#ffffff',gradient:null,guides:true,snap:true,side:'front',sides:{front:[],back:[]}},selected=null,counter=0,undoStack=[],redoStack=[],scale=1;
const clone=o=>JSON.parse(JSON.stringify(o)),items=()=>S.sides[S.side],newId=()=>`e${++counter}`;
function snapshot(){undoStack.push(JSON.stringify(S));if(undoStack.length>100)undoStack.shift();redoStack=[];historyButtons()}
function historyButtons(){$('undo').disabled=!undoStack.length;$('redo').disabled=!redoStack.length}
function element(type,p={}){return{id:newId(),type,x:35,y:35,w:type==='text'?230:90,h:type==='text'?38:70,text:type==='text'?'Your text':type==='qr'?'https://example.com':'',color:'#18202b',fill:'#79e2c4',font:'Arial',size:20,weight:'400',align:'left',opacity:100,border:'#18202b',bw:0,src:'',...p}}
function add(type,p){snapshot();const e=element(type,p);items().push(e);selected=e.id;render()}
function current(){return items().find(e=>e.id===selected)}
function fit(){const maxW=Math.max(190,stage.clientWidth-42),maxH=Math.max(170,stage.clientHeight-42);scale=Math.min(maxW/card.offsetWidth,maxH/card.offsetHeight,1.4);wrap.style.width=card.offsetWidth*scale+'px';wrap.style.height=card.offsetHeight*scale+'px';card.style.transform=`scale(${scale})`}
function render(){card.innerHTML='';card.style.width=(S.width/90*500)+'px';card.style.height=(S.height/54*300)+'px';card.style.background=S.gradient?`linear-gradient(135deg, ${S.gradient[0]}, ${S.gradient[1]})`:S.bg;const cw=card.offsetWidth,ch=card.offsetHeight;
if(S.guides){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('class','guides');svg.setAttribute('viewBox',`0 0 ${cw} ${ch}`);svg.innerHTML=`<rect x="7" y="7" width="${cw-14}" height="${ch-14}" fill="none" stroke="#ed5959" stroke-dasharray="5 4"/><rect x="${cw*.06}" y="${ch*.08}" width="${cw*.88}" height="${ch*.84}" fill="none" stroke="#219b78" stroke-dasharray="4 4"/>`;card.append(svg)}
items().forEach((e,i)=>{const d=document.createElement('div');d.className='el'+(e.id===selected?' selected':'');d.dataset.id=e.id;Object.assign(d.style,{left:e.x+'px',top:e.y+'px',width:e.w+'px',height:e.h+'px',opacity:e.opacity/100,zIndex:i+1});
if(e.type==='text'){d.textContent=e.text;Object.assign(d.style,{color:e.color,fontFamily:e.font,fontSize:e.size+'px',fontWeight:e.weight,textAlign:e.align,lineHeight:'1.2',padding:'2px'})}
else if(['rect','circle','badge'].includes(e.type)){d.style.background=e.fill;d.style.border=e.bw+'px solid '+e.border;if(e.type==='circle')d.style.borderRadius='50%';if(e.type==='badge'){d.style.borderRadius='50%';d.style.display='flex';d.style.alignItems='center';d.style.justifyContent='center';d.style.color=e.color;d.style.fontSize=e.size+'px';d.textContent=e.text||'✦'}}
else if(e.type==='line'){d.style.height=Math.max(2,e.bw||3)+'px';d.style.background=e.fill}
else if(e.type==='image'||e.type==='qr'){if(e.type==='qr'){d.style.background='#fff';d.style.padding='3px'}const im=document.createElement('img');im.src=e.type==='qr'?'https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(e.text||'https://example.com'):e.src;d.append(im)}
const h=document.createElement('span');h.className='resize';d.append(h);d.addEventListener('pointerdown',dragStart);d.addEventListener('click',ev=>{ev.stopPropagation();if(selected!==e.id){selected=e.id;render()}});card.append(d)});
card.onclick=()=>{selected=null;render()};$('front').classList.toggle('active',S.side==='front');$('back').classList.toggle('active',S.side==='back');$('bg').value=S.bg;$('dimensions').textContent=`${S.width} × ${S.height} mm`;$('selection').textContent=current()?`Selected: ${current().type}`:'Nothing selected';$('snapToggle').textContent='Snap to grid: '+(S.snap?'ON':'OFF');$('snapToggle').classList.toggle('active',S.snap);renderLayers();syncProps();fit();historyButtons()}
function renderLayers(){const box=$('layers');box.innerHTML='';[...items()].reverse().forEach(e=>{const b=document.createElement('button');b.className='layer'+(e.id===selected?' active':'');const icon=document.createElement('span');icon.textContent='◈';const name=document.createElement('span');name.textContent=e.type==='text'?e.text.slice(0,30):e.type==='image'?'Image / logo':e.type==='qr'?'QR code':e.type;b.append(icon,name);b.onclick=()=>{selected=e.id;render()};box.append(b)});if(!items().length)box.innerHTML='<span class="hint">No elements on this side.</span>'}
function syncProps(){const e=current();$('none').classList.toggle('hidden',!!e);$('props').classList.toggle('hidden',!e);if(!e)return;const vals={content:e.text||'',font:e.font,size:e.size,color:e.type==='text'?e.color:(e.fill||e.color),opacity:e.opacity,weight:e.weight,align:e.align,w:e.w,h:e.h,x:e.x,y:e.y,border:e.border,bw:e.bw};Object.entries(vals).forEach(([k,v])=>{if(document.activeElement!==$(k))$(k).value=v});$('contentWrap').classList.toggle('hidden',!['text','qr','badge'].includes(e.type));$('fontWrap').classList.toggle('hidden',e.type!=='text');$('textStyle').classList.toggle('hidden',e.type!=='text')}
function edit(k,v){const e=current();if(!e)return;snapshot();if(k==='content')e.text=v;else if(k==='font')e.font=v;else if(k==='size')e.size=+v||20;else if(k==='color'){if(e.type==='text'||e.type==='badge')e.color=v;else e.fill=v}else if(k==='opacity')e.opacity=+v;else if(k==='weight')e.weight=v;else if(k==='align')e.align=v;else if(['w','h','x','y','bw'].includes(k))e[k]=Math.max(['x','y','bw'].includes(k)?0:8,+v||0);else if(k==='border')e.border=v;render()}
['content','font','size','color','opacity','weight','align','w','h','x','y','border','bw'].forEach(k=>$(k).addEventListener('change',()=>edit(k,$(k).value)));
function dragStart(ev){if(ev.button!==0)return;ev.stopPropagation();let e=items().find(q=>q.id===ev.currentTarget.dataset.id);if(!e)return;if(selected!==e.id){selected=e.id;render()}const st={id:e.id,cx:ev.clientX,cy:ev.clientY,x:e.x,y:e.y,w:e.w,h:e.h,resize:ev.target.classList.contains('resize'),saved:false};function move(m){const q=items().find(a=>a.id===st.id);if(!q)return;let dx=(m.clientX-st.cx)/scale,dy=(m.clientY-st.cy)/scale;if(!st.saved&&Math.abs(dx)+Math.abs(dy)>2){snapshot();st.saved=true}if(st.resize){q.w=Math.max(8,Math.round(st.w+dx));q.h=Math.max(8,Math.round(st.h+dy))}else{q.x=Math.max(0,Math.round(st.x+dx));q.y=Math.max(0,Math.round(st.y+dy));if(S.snap){q.x=Math.round(q.x/5)*5;q.y=Math.round(q.y/5)*5}}render()}function end(){window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',end)}window.addEventListener('pointermove',move);window.addEventListener('pointerup',end,{once:true})}
function switchSide(s){S.side=s;selected=null;render()}
$('front').onclick=()=>switchSide('front');$('back').onclick=()=>switchSide('back');
$('addText').onclick=()=>add('text',{text:'Your text',x:40,y:40});$('addTitle').onclick=()=>add('text',{text:'YOUR NAME',x:35,y:35,w:300,h:48,size:30,weight:'800'});$('addRect').onclick=()=>add('rect',{x:30,y:30,w:140,h:70,fill:'#142238'});$('addCircle').onclick=()=>add('circle',{x:40,y:40,w:80,h:80,fill:'#79e2c4'});$('addLine').onclick=()=>add('line',{x:30,y:30,w:180,h:3,fill:'#18202b',bw:3});$('addQR').onclick=()=>add('qr',{x:365,y:180,w:75,h:75,text:'https://example.com'});$('addBadge').onclick=()=>add('badge',{x:370,y:35,w:75,h:75,text:'✦',fill:'#142238',color:'#ffffff',size:32});
$('addImage').onclick=()=>$('imageFile').click();$('imageFile').onchange=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>add('image',{src:r.result,x:45,y:45,w:120,h:90});r.readAsDataURL(f);ev.target.value=''};
$('bg').onchange=ev=>{snapshot();S.bg=ev.target.value;S.gradient=null;render()};$('gradient').onclick=()=>{snapshot();S.gradient=[$('gradA').value,$('gradB').value];render()};document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{snapshot();S.bg=b.dataset.color;S.gradient=null;render()});
$('preset').onchange=()=>{let v=$('preset').value;$('customSize').classList.toggle('hidden',v!=='custom');if(v!=='custom'){snapshot();[S.width,S.height]=v.split(',').map(Number);render()}};['mmW','mmH'].forEach(k=>$(k).onchange=()=>{snapshot();S.width=Math.max(30,Math.min(250,+$('mmW').value||90));S.height=Math.max(20,Math.min(150,+$('mmH').value||54));render()});
$('guides').onclick=()=>{snapshot();S.guides=!S.guides;render()};$('snapToggle').onclick=()=>{snapshot();S.snap=!S.snap;render()};
$('centerH').onclick=()=>{const e=current();if(!e)return;snapshot();e.x=Math.round((card.offsetWidth-e.w)/2);render()};$('centerV').onclick=()=>{const e=current();if(!e)return;snapshot();e.y=Math.round((card.offsetHeight-e.h)/2);render()};$('alignLeft').onclick=()=>{const e=current();if(!e)return;snapshot();e.x=0;render()};$('alignTop').onclick=()=>{const e=current();if(!e)return;snapshot();e.y=0;render()};
$('forward').onclick=()=>{const e=current();if(!e)return;snapshot();let a=items(),i=a.findIndex(q=>q.id===e.id);if(i>=0){a.splice(i,1);a.push(e)}render()};$('backward').onclick=()=>{const e=current();if(!e)return;snapshot();let a=items(),i=a.findIndex(q=>q.id===e.id);if(i>=0){a.splice(i,1);a.unshift(e)}render()};
$('delete').onclick=()=>{if(!current())return;snapshot();S.sides[S.side]=items().filter(e=>e.id!==selected);selected=null;render()};$('duplicate').onclick=()=>{const e=current();if(!e)return;snapshot();const c=clone(e);c.id=newId();c.x+=15;c.y+=15;items().push(c);selected=c.id;render()};$('clear').onclick=()=>{if(items().length&&confirm('Clear all elements on this side?')){snapshot();S.sides[S.side]=[];selected=null;render()}};
